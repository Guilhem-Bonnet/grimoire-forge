# Ponts entre la pile BMM (_grimoire-runtime, exposée à Copilot) et la pile kit
# (_grimoire/kit, exposée à Claude Code). Les deux piles vivent dans des fichiers
# distincts : les wrappers BMM déclarent leurs `handoffs:` en frontmatter, les
# agents du kit sont régénérés par `grimoire host sync` et ne peuvent rien
# déclarer. Ce fichier porte donc la seule relation que personne d'autre ne peut
# écrire — celle qui traverse la frontière.
#
# Lu par scripts/agent-index.py, qui refuse un pont dont une extrémité n'existe pas.

$schema: "grimoire-agent-bridges/v1"

# Deux agents qui portent le même nom des deux côtés, ou le même rôle sous deux
# noms. L'orchestrateur doit savoir lequel il active, et pourquoi.
duplicates:
  - names: ["grimoire-master", "concierge"]
    piles: ["bmm", "kit"]
    resolution: >-
      Même fonction de triage et de routage, et les deux sont désormais chargés
      en même temps sous Claude Code : le master SOG par l'import de CLAUDE.md,
      le concierge par le hook SessionStart du kit, qui injecte la persona
      d'entrée dans la boucle principale (Grimoire-kit#233). Sous Copilot, seul
      le master SOG est chargé. En cas de désaccord, le master SOG tranche : le
      concierge apporte le protocole de triage, pas la doctrine d'atelier.

# Relations réelles entre les deux piles : qui va chercher quoi de l'autre côté.
bridges:
  - from: "agent-optimizer"
    to: ["agent-builder", "workflow-builder", "analyst", "tech-writer", "architect", "dev"]
    reason: >-
      L'optimiseur audite ce que les builders produisent ; la boucle n'a de sens
      que fermée. Depuis grimoire-kit 3.42.0 il porte aussi, comme skills
      attachés, l'ancienne qualité mémoire (vers analyst et tech-writer), la
      cartographie du dépôt (vers architect et analyst) et la conception
      d'outils (vers workflow-builder et dev).
