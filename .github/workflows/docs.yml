name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
      - name: Build docs
        run: mkdocs build --strict

  link-check:
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check links
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          from pathlib import Path

          root = Path("docs")
          missing = []
          for md in root.rglob("*.md"):
              for token in md.read_text(encoding="utf-8").split("](")[1:]:
                  link = token.split(")", 1)[0]
                  if link.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  target = (md.parent / link.split("#", 1)[0]).resolve()
                  if link and not target.exists():
                      missing.append(f"{md}: {link}")
          if missing:
              raise SystemExit("Broken docs links:\n" + "\n".join(missing))
          print("Docs links OK")
          PY
