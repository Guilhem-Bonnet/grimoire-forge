# CI — Grimoire Forge
# Valide Forge et garde les anciens contrôles grimoire-kit seulement si le kit
# embarqué est réellement présent dans le checkout versionné.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck — scripts framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint grimoire-init.sh
        run: |
          [ -f grimoire-kit/grimoire-init.sh ] || { echo "grimoire-kit absent dans ce checkout — skip"; exit 0; }
          shellcheck -S warning grimoire-kit/grimoire-init.sh

      - name: Lint framework scripts
        run: |
          [ -f grimoire-kit/grimoire-init.sh ] || { echo "grimoire-kit absent dans ce checkout — skip"; exit 0; }
          shellcheck -S warning grimoire-kit/framework/cc-verify.sh
          shellcheck -S warning grimoire-kit/framework/sil-collect.sh
          shellcheck -S warning grimoire-kit/framework/hooks/pre-commit-cc.sh

  syntax-check:
    name: Syntax bash — validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bash syntax
        run: |
          [ -f grimoire-kit/grimoire-init.sh ] || { echo "grimoire-kit absent dans ce checkout — skip"; exit 0; }
          bash -n grimoire-kit/grimoire-init.sh && echo "✅ grimoire-init.sh"
          bash -n grimoire-kit/framework/cc-verify.sh && echo "✅ cc-verify.sh"
          bash -n grimoire-kit/framework/sil-collect.sh && echo "✅ sil-collect.sh"
          bash -n grimoire-kit/framework/hooks/pre-commit-cc.sh && echo "✅ pre-commit-cc.sh"

  smoke-test:
    name: Smoke test — grimoire-init.sh --help
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test --help flag
        run: |
          [ -f grimoire-kit/grimoire-init.sh ] || { echo "grimoire-kit absent dans ce checkout — skip"; exit 0; }
          bash grimoire-kit/grimoire-init.sh --help

      - name: Test detect_stack sur le repo lui-même
        run: |
          [ -f grimoire-kit/grimoire-init.sh ] || { echo "grimoire-kit absent dans ce checkout — skip"; exit 0; }
          source <(sed -n '/^detect_stack/,/^}/p' grimoire-kit/grimoire-init.sh)
          stacks=$(detect_stack "$(pwd)/grimoire-kit")
          echo "Stacks détectés : $stacks"
          [[ -n "$stacks" ]] && echo "✅ detect_stack OK" || echo "⚠️  Aucun stack détecté"

  python-quality:
    name: Python quality - grimoire-kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect embedded grimoire-kit
        id: kit_scope
        run: |
          if [ -f grimoire-kit/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.kit_scope.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.kit_scope.outputs.present == 'true'
        working-directory: grimoire-kit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov ruff "mcp>=1.0"

      - name: Run Ruff
        if: steps.kit_scope.outputs.present == 'true'
        working-directory: grimoire-kit
        run: python -m ruff check framework/tools/ tests/ --statistics

      - name: Run tests with coverage
        if: steps.kit_scope.outputs.present == 'true'
        working-directory: grimoire-kit
        run: |
          python -m pytest tests/ \
            --cov=src/grimoire \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --ignore=tests/test_background_tasks.py

      - name: Upload coverage reports to Codecov
        if: steps.kit_scope.outputs.present == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: grimoire-kit/coverage.xml
          flags: grimoire-kit
          name: grimoire-kit-py312

      - name: Skip notice
        if: steps.kit_scope.outputs.present != 'true'
        run: echo "Embedded grimoire-kit is not versioned in Forge; Python quality check skipped."

  visual-evidence-governance:
    name: Visual evidence governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect visual scope changes
        id: visual_scope
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            DIFF_BASE="origin/${{ github.base_ref }}"
          else
            DIFF_BASE="HEAD~1"
          fi
          git diff --name-only "$DIFF_BASE" HEAD > changed.txt
          if grep -E '^_grimoire-runtime-output/implementation-artifacts/(visual-brief\.md|brand-board\.md|ux-map\.md|motion-spec\.md|assets-manifest\.csv|implementation-pack/|proof-pack\.md|visual-evidence/)' changed.txt >/dev/null; then
            echo "run_check=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_check=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run visual evidence checks
        if: steps.visual_scope.outputs.run_check == 'true'
        run: |
          [ -f grimoire-kit/framework/tools/visual-evidence-governance.py ] \
            || { echo "visual-evidence-governance absent in this Forge checkout — skip legacy visual gate"; exit 0; }
          python grimoire-kit/framework/tools/visual-evidence-governance.py \
            --project-root . \
            check

      - name: Skip notice
        if: steps.visual_scope.outputs.run_check != 'true'
        run: echo "No visual-scope changes detected, visual governance check skipped."

  doc-drift-governance:
    name: Doc-as-code drift governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (pyyaml only)
        run: python -m pip install pyyaml

      - name: Determine diff base
        id: diff_base
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run doc-drift detector (blocking only)
        id: drift
        run: |
          set -euo pipefail
          [ -f grimoire-kit/framework/tools/doc-drift-detector.py ] \
            || { echo "doc-drift-detector absent — skip"; exit 0; }
          cd grimoire-kit
          set +e
          python framework/tools/doc-drift-detector.py \
            --project-root . \
            --since "${{ steps.diff_base.outputs.base }}" \
            --json > ../doc-drift-report.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Sortie humaine pour les logs CI
          python framework/tools/doc-drift-detector.py \
            --project-root . \
            --since "${{ steps.diff_base.outputs.base }}" || true

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-drift-report
          path: doc-drift-report.json
          if-no-files-found: ignore

      - name: Fail on blocking drift
        if: steps.drift.outputs.rc == '2'
        run: |
          echo "::error::Doc-drift BLOQUANT detecte. Mettre a jour les docs miroir declarees dans grimoire-kit/framework/tools/doc-manifest.yaml avant de merger."
          exit 1

      - name: Warn on enforcing/info drift
        if: steps.drift.outputs.rc == '1'
        run: |
          echo "::warning::Doc-drift non bloquant detecte (severity enforcing/info). Voir l'artifact doc-drift-report."

  grimoire-game-quality:
    name: Grimoire Game quality - Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect embedded Grimoire Game app
        id: game_scope
        run: |
          if [ -f grimoire-kit/apps/grimoire-game/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.game_scope.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: grimoire-kit/apps/grimoire-game/package-lock.json

      - name: Install dependencies
        if: steps.game_scope.outputs.present == 'true'
        working-directory: grimoire-kit/apps/grimoire-game
        run: npm ci

      - name: Type check
        if: steps.game_scope.outputs.present == 'true'
        working-directory: grimoire-kit/apps/grimoire-game
        run: npm run check

      - name: Build package
        if: steps.game_scope.outputs.present == 'true'
        working-directory: grimoire-kit/apps/grimoire-game
        run: npm run build

      - name: Run tests with coverage
        if: steps.game_scope.outputs.present == 'true'
        working-directory: grimoire-kit/apps/grimoire-game
        run: npm run test:coverage

      - name: Run cockpit proof
        if: steps.game_scope.outputs.present == 'true'
        working-directory: grimoire-kit/apps/grimoire-game
        run: npm run cockpit:verify

      - name: Verify npm package payload
        if: steps.game_scope.outputs.present == 'true'
        working-directory: grimoire-kit/apps/grimoire-game
        run: npm run pack:verify

      - name: Create npm package artifact
        if: steps.game_scope.outputs.present == 'true'
        working-directory: grimoire-kit/apps/grimoire-game
        run: npm run pack:artifact

      - name: Upload runtime artifacts
        if: steps.game_scope.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-game-runtime-artifacts
          path: |
            grimoire-kit/apps/grimoire-game/dist
            grimoire-kit/apps/grimoire-game/coverage
            grimoire-kit/apps/grimoire-game/.release

      - name: Upload coverage reports to Codecov
        if: steps.game_scope.outputs.present == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: grimoire-kit/apps/grimoire-game/coverage/lcov.info
          flags: grimoire-game
          name: grimoire-game-node22

      - name: Skip notice
        if: steps.game_scope.outputs.present != 'true'
        run: echo "Embedded Grimoire Game app is not versioned in Forge; Node.js quality check skipped."
