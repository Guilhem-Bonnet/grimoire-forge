project:
  name: "Grimoire-Forge"
  description: "Grimoire R&D forge — agentic runtime, memory OS, and standard adoption workspace."
  type: "library"

user:
  name: "Guilhem"
  language: "Français"
  document_language: "Français"
  skill_level: "expert"

memory:
  # --- Option de setup : avec ou sans base de données vectorielle ---
  # true  : recherche sémantique via DB vectorielle (weaviate-server / qdrant / ollama).
  # false : recherche lexicale locale (sqlite FTS5 BM25) — zéro service, zéro vecteur,
  #         zéro réseau. Pour les environnements interdisant une DB vectorielle locale.
  #         Bascule aussi semantic_memory vers sqlite-fts5 (voir memory-policy.yaml).
  vector_database: true
  retrieval_mode: "vector"   # vector | lexical
  backend: "auto"            # auto | weaviate-server | qdrant-server | qdrant-local | ollama | lexical | local
  # --- Mémoire chaude (contrat R8, optionnelle) ---
  short_term_backend: "sqlite"
  redis_url: ""
  neo4j_uri: "bolt://localhost:7687"
  knowledge_graph: "neo4j"
  memory_graph: "neo4j"
  code_graph: "neo4j"
  task_memory: "neo4j"

# Assistant d'édition de l'espace Source par modèle local (grimoire-kit 3.46.0,
# point 7 de l'audit du 2026-09-12). Ollama sur ce poste, jamais de fournisseur distant.
source:
  assist:
    model: "qwen3-coder:30b"
