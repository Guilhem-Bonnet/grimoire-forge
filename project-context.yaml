project:
  name: "Grimoire-Forge"
  description: "Grimoire R&D forge — agentic runtime, memory OS, and standard adoption
    workspace."
  type: "library"

user:
  name: "Guilhem"
  language: "Français"
  document_language: "Français"
  skill_level: "expert"

memory:
  # --- Option de setup : avec ou sans base de données vectorielle ---
  # true  : recherche sémantique via DB vectorielle (weaviate-server / qdrant / ollama).
  # false : recherche lexicale locale (sqlite FTS5 BM25) — zéro service, zéro vecteur,
  #         zéro réseau. Pour les environnements interdisant une DB vectorielle locale.
  #         Bascule aussi semantic_memory vers sqlite-fts5 (voir memory-policy.yaml).
  layer_profile: "complet"   # lexical | standard | graphe | complet (grimoire.memory.profiles)
  vector_database: true
  retrieval_mode: "vector"   # vector | lexical
  backend: "weaviate-server" # auto | weaviate-server | qdrant-server | qdrant-local | ollama | lexical | local
  # --- Mémoire chaude (contrat R8, optionnelle) ---
  short_term_backend: "redis"
  redis_url: "redis://localhost:6379/0"
  neo4j_uri: "bolt://localhost:7687"
  knowledge_graph: "neo4j"
  memory_graph: "neo4j"
  code_graph: "neo4j"
  task_memory: "neo4j"

# Assistant d'édition de l'espace Source par modèle local (grimoire-kit 3.46.0,
# point 7 de l'audit du 2026-09-12). Ollama sur ce poste, jamais de fournisseur distant.
  collection_prefix: grimoire_forge
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  neo4j_database: neo4j
  neo4j_password_env: GRIMOIRE_NEO4J_PASSWORD
  neo4j_user: neo4j
  weaviate_collection: GrimoireForgeMemory
  weaviate_url: http://localhost:8080
source:
  assist:
    model: "qwen3-coder:30b"

# Hôtes émis par host sync (grimoire-kit 3.47.0, #177). Liste explicite,
# égale à la détection : les cinq hôtes ont déjà leurs fichiers dans la Forge.
hosts:
  enabled: [claude, copilot, gemini, cursor, codex]

# Besoins d'exécution (grimoire-kit #205, lot 2). Déclaration explicite parce
# que la détection par marqueurs est fausse ici : la Forge est un atelier
# Python + scripts shell, mais son seul manifeste racine est un `package.json`
# (Playwright pour les recettes d'interface du cockpit, plus quatre scripts
# `quality`/`standard:*`) — sans script `test`. La détection retenait donc
# `npm test`, une commande qui n'existe pas dans ce dépôt.
# La vraie suite de l'atelier est celle des gardes de hooks :
# `.github/hooks/tests/` (7 tests, ~0,1 s).
needs:
  commands:
    test-runner: ".venv/bin/python -m pytest .github/hooks/tests/ -q"
