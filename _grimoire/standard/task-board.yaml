- task_id: r8-redis-adapter
  title: R8 — Redis hot memory adapter
  status: archived
  priority: high
  owner: grimoire-maintainers
  agent_roles:
  - implementation-agent
  acceptance_criteria:
  - Redis adapter implemented in Kit with TTL payloads, leases, namespaced event publishing, and optional install extra.
  - Forge declares Redis as optional hot memory while keeping durable Weaviate, Neo4j, and SQLite authoritative.
  - Memory OS status reports Redis as ready when configured, or partial/soft-fail without data loss when Redis is 
    absent.
  - Standard verify stays green from a Forge-only checkout without vendored grimoire-kit.
  verifiability:
    class: V2
    explanation: "Au moins un critère ne nomme ni verdict mécanique reconnu ni revue reconnue — ou la tâche n'a aucun critère
