$schema: "grimoire-agentic-standard-task-board/v1"
metadata:
  project: "Grimoire-Forge"
  generated_by: "grimoire standard init"
  purpose: "Governed kanban for agentic work."
states:
  - proposed
  - ready
  - in_progress
  - blocked
  - review
  - accepted
  - released
  - archived
transitions:
  proposed_to_ready:
    requires:
      - acceptance_criteria
      - owner_or_agent_role
  ready_to_in_progress:
    requires:
      - context_bundle
      - provider_policy
      - memory_os_hot_layer_policy
  in_progress_to_review:
    requires:
      - evidence_pack
      - decision_trace
  review_to_accepted:
    requires:
      - review_gate
      - evidence_gate
  accepted_to_released:
    requires:
      - compliance_score
      - release_authorization
      - hot_memory_degradation_recorded
  any_to_blocked:
    requires:
      - blocker_reason
      - remediation_plan
tasks:
  - task_id: "r7-forge-kit-adoption"
    title: "R7 — Forge adopts canonical grimoire-kit"
    status: "in_progress"
    priority: "high"
    owner: "grimoire-maintainers"
    agent_roles:
      - orchestrator
      - implementation-agent
    acceptance_criteria:
      - "grimoire-kit/.venv installs canonical Kit (v3.4.4+) via editable path."
      - "grimoire standard verify passes from Forge root."
      - "Forge standard artifacts aligned with Memory OS contract."
    blockers: []
    context_bundle_ref: "_grimoire-output/context/r7-forge-kit-adoption/context-bundle.yaml"
    decision_trace_ref: "_grimoire-output/decisions/r7-forge-kit-adoption/decision-trace.yaml"
    evidence_pack_ref: "_grimoire-output/evidence/r7-forge-kit-adoption/evidence-pack.md"
    remediation_ref: "_grimoire/standard/remediation-plan.yaml"
  - task_id: "r8-redis-adapter"
    title: "R8 — Redis hot memory adapter"
    status: "review"
    priority: "high"
    owner: "grimoire-maintainers"
    agent_roles:
      - implementation-agent
    acceptance_criteria:
      - "Redis adapter implemented in Kit with TTL payloads, leases, namespaced event publishing, and optional install extra."
      - "Forge declares Redis as optional hot memory while keeping durable Weaviate, Neo4j, and SQLite authoritative."
      - "Memory OS status reports Redis as ready when configured, or partial/soft-fail without data loss when Redis is absent."
      - "Standard verify stays green from a Forge-only checkout without vendored grimoire-kit."
    blockers: []
    context_bundle_ref: "_grimoire-output/context/r8-redis-adapter/context-bundle.yaml"
    decision_trace_ref: "_grimoire-output/decisions/r8-redis-adapter/decision-trace.yaml"
    evidence_pack_ref: "_grimoire-output/evidence/r8-redis-adapter/evidence-pack.md"
  - task_id: "r9-hooks-skills"
    title: "R9 — Normalize hooks/rules/skills/agents taxonomy"
    status: "review"
    priority: "medium"
    owner: "grimoire-maintainers"
    agent_roles:
      - implementation-agent
    acceptance_criteria:
      - "Hooks are classified into core template candidates, Forge project pack, and incubator assets."
      - "Skills are classified before promotion into Kit templates or governed Forge packs."
      - "hook-registry.yaml, rule-packs.yaml and pattern-catalog.yaml link hook/skill rules to evidence gates."
      - "standard verify stays green after taxonomy changes."
    blockers: []
    context_bundle_ref: "_grimoire-output/context/r9-hooks-skills/context-bundle.yaml"
    decision_trace_ref: "_grimoire-output/decisions/r9-hooks-skills/decision-trace.yaml"
    evidence_pack_ref: "_grimoire-output/evidence/r9-hooks-skills/evidence-pack.md"
  - task_id: "r10-cockpit"
    title: "R10 — Cockpit/observability"
    status: "review"
    priority: "medium"
    owner: "grimoire-maintainers"
    agent_roles:
      - implementation-agent
    acceptance_criteria:
      - "Cockpit inputs are declared in observability-policy.yaml."
      - "Cockpit report is generated from standard artifacts, runtime events and evidence packs only."
      - "Cockpit remains read-only and never becomes the source of truth for tasks, memory, gates or scores."
      - "Governed standard verify, audit and docs build stay green."
    blockers: []
    context_bundle_ref: "_grimoire-output/context/r10-cockpit/context-bundle.yaml"
    decision_trace_ref: "_grimoire-output/decisions/r10-cockpit/decision-trace.yaml"
    evidence_pack_ref: "_grimoire-output/evidence/r10-cockpit/evidence-pack.md"
  - task_id: "c1-board-transitions"
    title: "C1 — Journal append-only des transitions kanban"
    status: "review"
    priority: "high"
    owner: "grimoire-maintainers"
    agent_roles:
      - implementation-agent
    acceptance_criteria:
      - "Toute edition de task-board.yaml changeant un statut produit un event journalise par hook."
      - "Une transition illegale fait echouer npm run quality."
      - "grimoire-hooks-smoke.sh couvre le hook grimoire-board-transitions."
    blockers: []
    context_bundle_ref: "_grimoire-output/context/c1-board-transitions/context-bundle.yaml"
    decision_trace_ref: "_grimoire-output/decisions/c1-board-transitions/decision-trace.yaml"
    evidence_pack_ref: "_grimoire-output/evidence/c1-board-transitions/evidence-pack.md"
  - task_id: "c2-evidence-reconcile"
    title: "C2 — Reconciliateur evidence contre traces machine"
    status: "review"
    priority: "high"
    owner: "grimoire-maintainers"
    agent_roles:
      - implementation-agent
    acceptance_criteria:
      - "Un claim de chemin absent du disque est classe CONTRADICTED et fait echouer la gate."
      - "Les refs manquantes d'une tache en review sont detectees."
      - "Les packs existants passent ou portent une requalification explicite."
    blockers: []
    context_bundle_ref: "_grimoire-output/context/c2-evidence-reconcile/context-bundle.yaml"
    decision_trace_ref: "_grimoire-output/decisions/c2-evidence-reconcile/decision-trace.yaml"
    evidence_pack_ref: "_grimoire-output/evidence/c2-evidence-reconcile/evidence-pack.md"
  - task_id: "c3-step-proof"
    title: "C3 — Preuve par step via workflow-state-manifest"
    status: "review"
    priority: "medium"
    owner: "grimoire-maintainers"
    agent_roles:
      - implementation-agent
    acceptance_criteria:
      - "La suppression de l'artefact d'un step intermediaire fait echouer le checker."
      - "La dette anterieure est exemptee explicitement, jamais silencieuse."
    blockers: []
    context_bundle_ref: "_grimoire-output/context/c3-step-proof/context-bundle.yaml"
    decision_trace_ref: "_grimoire-output/decisions/c3-step-proof/decision-trace.yaml"
    evidence_pack_ref: "_grimoire-output/evidence/c3-step-proof/evidence-pack.md"
  - task_id: "c4-engagement-metric"
    title: "C4 — Mesure d'engagement des workflows"
    status: "review"
    priority: "medium"
    owner: "grimoire-maintainers"
    agent_roles:
      - implementation-agent
    acceptance_criteria:
      - "Chaque session produit des events d'engagement horodates."
      - "Le rapport distingue jamais engage de engage sans effet."
    blockers: []
    context_bundle_ref: "_grimoire-output/context/c4-engagement-metric/context-bundle.yaml"
    decision_trace_ref: "_grimoire-output/decisions/c4-engagement-metric/decision-trace.yaml"
    evidence_pack_ref: "_grimoire-output/evidence/c4-engagement-metric/evidence-pack.md"
  - task_id: "c5-golden-run"
    title: "C5 — Golden run du workflow pilote"
    status: "review"
    priority: "low"
    owner: "grimoire-maintainers"
    agent_roles:
      - implementation-agent
    acceptance_criteria:
      - "Un run degrade est signale par le diff sans audit manuel."
      - "Le referentiel est versionne avec procedure de mise a jour documentee."
    blockers: []
    context_bundle_ref: "_grimoire-output/context/c5-golden-run/context-bundle.yaml"
    decision_trace_ref: "_grimoire-output/decisions/c5-golden-run/decision-trace.yaml"
    evidence_pack_ref: "_grimoire-output/evidence/c5-golden-run/evidence-pack.md"
