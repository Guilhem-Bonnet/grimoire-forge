  status: accepted
  priority: high
  owner: grimoire-maintainers
  agent_roles:
  - orchestrator
  - implementation-agent
  acceptance_criteria:
  - The Forge venv installs the published grimoire-kit release (>= 3.34.2) from PyPI, not an editable working tree.
  - grimoire standard verify passes from Forge root.
  - Forge standard artifacts aligned with Memory OS contract.
