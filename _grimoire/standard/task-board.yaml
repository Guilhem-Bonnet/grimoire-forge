$schema: grimoire-agentic-standard-task-board/v1
metadata:
  project: Grimoire-Forge
  generated_by: grimoire task board export
  purpose: Projection du Mission Ledger (ADR-005) — ne pas éditer à la main.
  source: mission-ledger
states:
- proposed
- ready
- in_progress
- blocked
- review
- accepted
- released
- archived
transitions:
  proposed_to_ready:
    requires:
    - acceptance_criteria
    - owner_or_agent_role
  ready_to_in_progress:
    requires:
    - context_bundle
    - provider_policy
  in_progress_to_review:
    requires:
    - evidence_pack
    - decision_trace
  review_to_accepted:
    requires:
    - review_gate
    - evidence_gate
  accepted_to_released:
    requires:
    - compliance_score
    - release_authorization
  any_to_blocked:
    requires:
    - blocker_reason
    - remediation_plan
tasks:
- task_id: bootstrap
  title: Bootstrap — baseline du standard agentique sur la Forge
  status: accepted
  priority: high
  owner: grimoire-maintainers
  agent_roles:
  - orchestrator
  acceptance_criteria:
  - grimoire standard verify passe sans erreur depuis la racine de la Forge.
  - Les artefacts du profil sont générés, remplis et vérifiés.
  verifiability:
    class: V2
    explanation: "Au moins un critère ne nomme ni verdict mécanique reconnu ni revue reconnue — ou la tâche n'a aucun critère
      : sa vérifiabilité reste à démontrer."
    criteria:
    - criterion: grimoire standard verify passe sans erreur depuis la racine de la Forge.
      pattern:
    - criterion: Les artefacts du profil sont générés, remplis et vérifiés.
      pattern:
  blockers: []
  context_bundle_ref: _grimoire-output/context/bootstrap/context-bundle.yaml
  decision_trace_ref: _grimoire-output/decisions/bootstrap/decision-trace.yaml
  evidence_pack_ref: _grimoire-output/evidence/bootstrap/evidence-pack.md
  remediation_ref: _grimoire/standard/remediation-plan.yaml
