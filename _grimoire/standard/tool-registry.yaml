# Erreurs d'outil : preuve par défaut, incident à partir d'une gravité.
error_capture:
  policy: evidence            # evidence | incident
  evidence_target: "_grimoire-output/evidence/{task-id}/evidence-pack.md"
  incident_from_severity: élevée
  incident_target: "_grimoire/standard/incident-registry.yaml"

allowed:
  kinds: [shell, file, search, network, browser, mcp, model]
  risks: [faible, moyen, élevé, critique]
  permissions: [read, write, execute, network, external]
  policies: [evidence, incident]
