# Nettoyages périodiques : TTL, doublons, obsolescence, données sensibles.
cleanup:
  - date: "2026-09-04"
    scope: "registre cockpit, résidus de l'étage kit, worktrees du dépôt produit"
    reviewed: 87
    actions: "71 entrées cockpit mortes retirées (cockpit prune), 5 résidus kit supprimés (mem0-bridge, memory_seed, workflow-graph, workflow-status, github-cc-check), 9 worktrees périmés retirés, clone partagé remis sur main"
    next_review: "2026-10-04"
# - date: ""
#   scope: "docs, mémoire vectorielle, rapports, handoffs"
#   reviewed: 0
#   actions: ""
#   next_review: ""

# Purges de mémoire fausse ou contaminée : chacune est suivie comme incident.
purges: []
# - date: ""
#   target: ""
#   reason: ""
#   incident_id: ""         # entrée du registre d'incidents

allowed:
  types: [adr, rapport, handoff, log, charte, api, incident, preuve, mémoire]
  statuses: [active, archived, superseded, obsolete, sensitive]
  sensitivities: [public, interne, confidentiel, secret, personnel]
  retentions: [durable, projet, mission, "court terme", purge]
