    timestamp: "2026-06-06T17:35:00Z"
  - decision_id: "r10-exclude-legacy-observatory-as-source"
    task_id: "r10-cockpit"
    decision_type: "context_source_selection"
    profile: "governed"
    inputs:
      - "_grimoire-runtime-output/observatory.html"
      - "_grimoire-runtime-output/hook-runtime"
      - "_grimoire/standard/observability-policy.yaml"
    policy_refs:
      - "observability-governance.declared-inputs-only"
    rule_refs:
      - "observability.inputs-are-declared"
