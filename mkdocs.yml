site_name: Grimoire Forge
site_description: Moteur de creation de projets agentiques, pilote en dogfooding continu.
site_url: https://guilhem-bonnet.github.io/grimoire-forge/
repo_url: https://github.com/Guilhem-Bonnet/grimoire-forge
repo_name: Guilhem-Bonnet/grimoire-forge
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: teal
      accent: amber
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.action.edit
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/forge-landing.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Accueil: index.md
