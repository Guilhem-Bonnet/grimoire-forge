# Docker Compose - Qdrant for Grimoire Forge local memory
#
# Usage:
#   docker compose -f docker-compose.qdrant.yml up -d
#   docker compose -f docker-compose.qdrant.yml down
#
# Dashboard:
#   http://localhost:6333/dashboard

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: grimoire-forge-qdrant
    restart: unless-stopped
    ports:
      - "${GRIMOIRE_QDRANT_PORT:-6333}:6333"
      - "${GRIMOIRE_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - grimoire_forge_qdrant_storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  grimoire_forge_qdrant_storage:
    name: grimoire-forge-qdrant-storage
